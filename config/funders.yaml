# Watchlist: funders whose calls page is read every day by the local AI monitor (monitor/local_monitor.py).
# Add one entry per page. "eligible" = where applicants must be based (EU = Europe-wide).
# Keep it to funders whose calls are OPEN (anyone eligible can apply, not invitation-only).

# --- Europe-wide ---
- id: ecf-culture-solidarity
  name: European Cultural Foundation – Culture of Solidarity
  calls_url: https://culturalfoundation.eu/programmes/culture-of-solidarity-fund/
  themes: [culture, democracy]
  eligible: [EU]
  language: en

- id: eyf
  name: European Youth Foundation (Council of Europe)
  calls_url: https://www.coe.int/en/web/european-youth-foundation/calls
  themes: [youth, democracy]
  eligible: [EU]
  language: en
  note: Applicants must first register with the EYF.

- id: allianz-foundation
  name: Allianz Foundation
  calls_url: https://allianzfoundation.org/
  themes: [culture, democracy, sustainability]
  eligible: [EU]
  language: en
  note: Annual grants programme (Europe & Mediterranean). Home page watched because each year's call gets a new URL.

- id: civitates
  name: Civitates
  calls_url: https://civitates-eu.org/
  themes: [democracy, civil-society]
  eligible: [EU]
  language: en
  note: Calls are usually limited to a few priority countries.

- id: guerrilla-foundation
  name: Guerrilla Foundation
  calls_url: https://guerrillafoundation.org/what-we-fund/
  themes: [democracy, sustainability, migrants]
  eligible: [EU]
  language: en
  note: Expressions of interest year-round; grassroots movements across geographic Europe.

